<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC VOCA MASTER 2.0</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#f1f5f9;
 font-family:Arial,sans-serif;
 color:#1e293b;
}

.container{
 max-width:560px;
 margin:auto;
}

h1{
 text-align:center;
 color:#2563eb;
 font-size:25px;
}

h2{font-size:19px}

.card{
 background:white;
 border-radius:16px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:0 3px 12px #0001;
}

button,select,input{
 width:100%;
 padding:14px;
 margin:6px 0;
 border-radius:10px;
 font-size:16px;
 border:1px solid #cbd5e1;
}

button{
 background:#2563eb;
 color:white;
 border:none;
 font-weight:bold;
 cursor:pointer;
}

button:disabled{opacity:.5}

.secondary{background:#475569}
.green{background:#16a34a}
.red{background:#dc2626}

.option{
 background:#f8fafc;
 color:#1e293b;
 border:1px solid #cbd5e1;
 text-align:left;
 min-height:58px;
}

.correct{background:#bbf7d0!important}
.wrong{background:#fecaca!important}

.hidden{display:none!important}
.center{text-align:center}

.small{
 font-size:13px;
 color:#64748b;
 line-height:1.6;
}

.statGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.stat{
 background:#eff6ff;
 padding:15px;
 border-radius:12px;
 text-align:center;
}

.stat strong{
 display:block;
 font-size:23px;
 color:#2563eb;
 margin-bottom:5px;
}

.progress{
 background:#e2e8f0;
 height:10px;
 border-radius:10px;
 overflow:hidden;
 margin:12px 0;
}

.bar{
 background:#2563eb;
 height:100%;
 width:0%;
 transition:width .2s;
}

label{
 display:block;
 margin-top:12px;
 font-weight:bold;
}

.reviewItem{
 border-bottom:1px solid #e2e8f0;
 padding:12px 0;
 line-height:1.7;
 overflow-wrap:anywhere;
}

.question{
 font-size:25px;
 text-align:center;
 margin:30px 0;
 overflow-wrap:anywhere;
}

.feedback{
 font-weight:bold;
 text-align:center;
 line-height:1.6;
}

.badge{
 display:inline-block;
 background:#dbeafe;
 padding:5px 9px;
 border-radius:7px;
 font-size:12px;
}

.row{
 display:flex;
 gap:8px;
}

.row button{flex:1}

</style>
</head>

<body>

<div class="container">

<h1>📚 TOEIC VOCA MASTER 2.0</h1>

<div id="home">

<div class="card">
<h2>📊 나의 학습 현황</h2>

<div class="statGrid">
<div class="stat">
<strong id="totalWords">0</strong>
등록 단어·숙어
</div>

<div class="stat">
<strong id="studiedWords">0</strong>
학습한 항목
</div>

<div class="stat">
<strong id="accuracy">0%</strong>
누적 정답률
</div>

<div class="stat">
<strong id="wrongCount">0</strong>
오답노트
</div>
</div>

<p id="progressLabel" class="small"></p>

<div class="progress">
<div id="totalProgress" class="bar"></div>
</div>
</div>

<div class="card">
<h2>📂 단어장 관리</h2>

<p class="small">
엑셀 B열: 영어 단어 / C열: 뜻<br>
엑셀 F열: 영어 숙어 / G열: 뜻
</p>

<input type="file" id="excel" accept=".xlsx,.xls">

<label>업데이트 방식</label>
<select id="importMode">
<option value="merge">기존 단어장 업데이트</option>
<option value="replace">기존 단어장 교체</option>
</select>

<p id="importResult" class="small"></p>

<button class="secondary" onclick="exportBackup()">
💾 학습 데이터 백업
</button>

<input type="file" id="restoreFile" accept=".json">

<button class="secondary" onclick="restoreBackup()">
📥 백업 데이터 복원
</button>
</div>

<div class="card">
<h2>📝 퀴즈 설정</h2>

<label>학습 범위</label>
<select id="category">
<option value="all">단어 + 숙어 통합</option>
<option value="word">영어 단어</option>
<option value="phrase">영어 숙어</option>
</select>

<label>출제 방향</label>
<select id="direction">
<option value="en">영어 → 한국어</option>
<option value="ko">한국어 → 영어</option>
</select>

<label>진행 방식</label>
<select id="mode">
<option value="study">학습 모드</option>
<option value="exam">시험 모드</option>
</select>

<label>보기 난이도</label>
<select id="difficulty">
<option value="normal">일반 모드</option>
<option value="advanced">심화 모드</option>
</select>

<label>출제 방식</label>
<select id="order">
<option value="random">완전 랜덤</option>
<option value="new">미학습 단어 우선</option>
<option value="weak">자주 틀린 단어 우선</option>
</select>

<label>문제 수</label>
<select id="amount">
<option value="10">10문제</option>
<option value="20">20문제</option>
<option value="50">50문제</option>
<option value="all">전체 문제</option>
</select>

<button onclick="startQuiz(false)">
🚀 퀴즈 시작
</button>

<button class="green" onclick="startQuiz(true)">
🔁 오답 재시험
</button>

<button class="secondary" onclick="showWrong()">
📕 오답노트
</button>
</div>

<div class="card">
<h2>🧠 심화 보기 관리</h2>

<p class="small">
심화 보기 데이터(JSON)를 등록하면
해당 단어에 대해 헷갈리기 쉬운 오답을 사용합니다.
</p>

<input type="file" id="advancedFile" accept=".json">

<button onclick="importAdvanced()">
심화 보기 데이터 등록
</button>

<p id="advancedCount" class="small"></p>

<p class="small">
심화 보기가 등록되지 않은 단어는
일반 보기 방식으로 출제됩니다.
</p>
</div>

</div>

<div id="quiz" class="card hidden">

<p id="progressText"></p>

<div class="progress">
<div id="quizBar" class="bar"></div>
</div>

<p id="questionType" class="small center"></p>

<h2 id="question" class="question"></h2>

<div id="options"></div>

<p id="feedback" class="feedback"></p>

<button id="nextBtn"
class="hidden"
onclick="nextQuestion()">
다음 문제 →
</button>

<button class="secondary" onclick="quitQuiz()">
학습 종료
</button>

</div>

<div id="result" class="card hidden">

<h2 class="center">🎉 학습 결과</h2>

<h1 id="score"></h1>

<p id="resultText" class="center"></p>

<div id="review"></div>

<button onclick="goHome()">메인 화면</button>

</div>

<div id="wrongPage" class="card hidden">

<h2>📕 오답노트</h2>

<div id="wrongList"></div>

<button onclick="startQuiz(true)">
오답 재시험
</button>

<button class="secondary" onclick="goHome()">
메인 화면
</button>

</div>

</div>

<script>

/* =========================
   데이터 저장
========================= */

const WORD_KEY="toeic_voca_words_v1";
const OLD_WRONG_KEY="toeic_voca_wrong_v1";

const STATS_KEY="toeic_voca_stats_v2";
const ADVANCED_KEY="toeic_voca_advanced_v2";

const $=id=>document.getElementById(id);

function readStorage(key,fallback){
 try{
  const data=JSON.parse(localStorage.getItem(key));
  return data??fallback;
 }catch(e){
  return fallback;
 }
}

let words=readStorage(WORD_KEY,[]);
let oldWrong=readStorage(OLD_WRONG_KEY,{});
let stats=readStorage(STATS_KEY,{});
let advanced=readStorage(ADVANCED_KEY,{});

let questions=[];
let index=0;
let answers=[];
let currentMode="study";
let direction="en";
let active=false;

function key(w){
 return w.type+"|"+w.en+"|"+w.ko;
}

function getStat(w){
 const k=key(w);

 if(!stats[k]){
  stats[k]={
   attempts:0,
   correct:0,
   wrong:oldWrong[k]||0,
   pendingWrong:(oldWrong[k]||0)>0
  };
 }

 return stats[k];
}

function save(){
 try{
  localStorage.setItem(WORD_KEY,JSON.stringify(words));
  localStorage.setItem(STATS_KEY,JSON.stringify(stats));
  localStorage.setItem(ADVANCED_KEY,JSON.stringify(advanced));
 }catch(e){
  alert("저장 공간이 부족하거나 브라우저 저장이 차단되었습니다. 데이터를 백업해 주세요.");
 }
 updateDashboard();
}

function shuffle(arr){
 const result=[...arr];

 for(let i=result.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [result[i],result[j]]=[result[j],result[i]];
 }

 return result;
}

function showPage(id){
 ["home","quiz","result","wrongPage"].forEach(x=>{
  $(x).classList.add("hidden");
 });

 $(id).classList.remove("hidden");
 window.scrollTo(0,0);
}

/* =========================
   학습 통계
========================= */

function updateDashboard(){

 const studied=words.filter(w=>getStat(w).attempts>0);

 const pending=words.filter(w=>getStat(w).pendingWrong);

 let totalAttempts=0;
 let totalCorrect=0;

 Object.values(stats).forEach(s=>{
  totalAttempts+=s.attempts||0;
  totalCorrect+=s.correct||0;
 });

 const accuracy=totalAttempts?
 Math.round(totalCorrect/totalAttempts*100):0;

 $("totalWords").textContent=words.length;
 $("studiedWords").textContent=studied.length;
 $("wrongCount").textContent=pending.length;
 $("accuracy").textContent=accuracy+"%";

 const progress=words.length?
 Math.round(studied.length/words.length*100):0;

 $("totalProgress").style.width=progress+"%";

 $("progressLabel").textContent=
 `전체 학습 진도율: ${progress}%`;

 $("advancedCount").textContent=
 "등록된 심화 보기: "+
 Object.keys(advanced).length+"개";
}

/* =========================
   엑셀 불러오기
========================= */

$("excel").addEventListener("change",async e=>{

 const file=e.target.files[0];
 if(!file)return;

 try{

  if(typeof XLSX==="undefined"){
   throw new Error("엑셀 라이브러리를 불러오지 못했습니다.");
  }

  const data=await file.arrayBuffer();

  const workbook=XLSX.read(data,{type:"array"});

  const imported=[];

  workbook.SheetNames.forEach(name=>{

   const sheet=workbook.Sheets[name];

   const rows=XLSX.utils.sheet_to_json(sheet,{
    header:1,
    defval:""
   });

   rows.forEach(row=>{

    const en=String(row[1]||"").trim();
    const ko=String(row[2]||"").trim();

    const phrase=String(row[5]||"").trim();
    const meaning=String(row[6]||"").trim();

    if(en&&ko){
     imported.push({
      en,ko,type:"word"
     });
    }

    if(phrase&&meaning){
     imported.push({
      en:phrase,
      ko:meaning,
      type:"phrase"
     });
    }

   });

  });

  const oldKeys=new Set(words.map(key));

  const unique=new Map();

  imported.forEach(w=>{
   unique.set(key(w),w);
  });

  const incoming=[...unique.values()];

  const added=incoming.filter(w=>!oldKeys.has(key(w))).length;

  if($("importMode").value==="replace"){

   if(!confirm("기존 단어장을 교체할까요? 학습 통계는 동일한 항목에 대해 유지됩니다.")){
    return;
   }

   words=incoming;

  }else{

   const map=new Map();

   [...words,...incoming].forEach(w=>{
    map.set(key(w),w);
   });

   words=[...map.values()];
  }

  save();

  $("importResult").textContent=
   `불러오기 완료! 신규 ${added}개 / 현재 총 ${words.length}개`;

  alert("단어장 업데이트 완료!");

 }catch(err){

  alert("엑셀 불러오기 실패: "+err.message);

 }

 e.target.value="";

});

/* =========================
   보기 생성
========================= */

function getChoices(w,category){

 const answerKey=direction==="en"?"ko":"en";

 const correct=w[answerKey];

 let distractors=[];

 const saved=advanced[key(w)];

 if($("difficulty").value==="advanced" && saved){

  const candidate=direction==="en"?
   saved.ko:saved.en;

  if(Array.isArray(candidate)){
   distractors=candidate
    .filter(x=>typeof x==="string")
    .filter(x=>x.trim()!==correct)
    .slice(0,3);
  }

 }

 const pool=words.filter(x=>
  (category==="all"||x.type===category)
 );

 const fallback=shuffle(
  [...new Set(pool.map(x=>x[answerKey]))]
   .filter(x=>x!==correct)
 );

 for(const item of fallback){

  if(distractors.length>=3)break;

  if(!distractors.includes(item)){
   distractors.push(item);
  }

 }

 return shuffle([correct,...distractors.slice(0,3)]);

}

/* =========================
   퀴즈 시작
========================= */

function startQuiz(onlyWrong){

 if(active){
  alert("진행 중인 학습을 먼저 종료해 주세요.");
  return;
 }

 const category=$("category").value;

 direction=$("direction").value;
 currentMode=$("mode").value;

 let pool=words.filter(w=>
  category==="all"||w.type===category
 );

 if(onlyWrong){
  pool=pool.filter(w=>getStat(w).pendingWrong);
 }

 if(!pool.length){
  alert("출제할 단어가 없습니다.");
  return;
 }

 const answerKey=direction==="en"?"ko":"en";

 const distinct=new Set(
  words.filter(w=>category==="all"||w.type===category)
   .map(w=>w[answerKey])
 );

 if(distinct.size<4){
  alert("서로 다른 정답이 최소 4개 필요합니다.");
  return;
 }

 pool=shuffle(pool);

 const order=$("order").value;

 if(order==="new"){

  pool.sort((a,b)=>
   getStat(a).attempts-getStat(b).attempts
  );

 }else if(order==="weak"){

  pool.sort((a,b)=>
   getStat(b).wrong-getStat(a).wrong
  );

 }

 const amount=$("amount").value;

 const count=amount==="all"?
 pool.length:Math.min(Number(amount),pool.length);

 questions=pool.slice(0,count).map(w=>({
  word:w,
  choices:getChoices(w,category)
 }));

 questions=questions.filter(q=>q.choices.length===4);

 if(!questions.length){
  alert("출제 가능한 문제가 없습니다.");
  return;
 }

 index=0;
 answers=[];
 active=true;

 showPage("quiz");
 renderQuestion();

}

/* =========================
   문제 표시
========================= */

function renderQuestion(){

 const q=questions[index];

 const questionKey=direction==="en"?"en":"ko";

 $("progressText").textContent=
 `문제 ${index+1} / ${questions.length}`;

 $("quizBar").style.width=
 `${index/questions.length*100}%`;

 $("questionType").textContent=
 q.word.type==="word"?"영어 단어":"영어 숙어";

 $("question").textContent=q.word[questionKey];

 $("feedback").textContent="";

 $("nextBtn").classList.add("hidden");

 const area=$("options");
 area.innerHTML="";

 q.choices.forEach((choice,i)=>{

  const btn=document.createElement("button");

  btn.className="option";

  btn.textContent=
   String.fromCharCode(65+i)+". "+choice;

  btn.dataset.choice=choice;

  btn.onclick=()=>selectAnswer(choice,btn);

  area.appendChild(btn);

 });

}

/* =========================
   정답 처리
========================= */

function selectAnswer(choice,button){

 const q=questions[index];

 const answerKey=direction==="en"?"ko":"en";

 const correct=q.word[answerKey];

 const isCorrect=choice===correct;

 answers.push({
  word:q.word,
  selected:choice,
  correct,
  isCorrect
 });

 const s=getStat(q.word);

 s.attempts++;

 if(isCorrect){

  s.correct++;
  s.pendingWrong=false;

 }else{

  s.wrong++;
  s.pendingWrong=true;

 }

 save();

 if(currentMode==="exam"){
  nextQuestion();
  return;
 }

 const buttons=$("options").querySelectorAll("button");

 buttons.forEach(btn=>{

  btn.disabled=true;

  if(btn.dataset.choice===correct){
   btn.classList.add("correct");
  }

 });

 if(!isCorrect){
  button.classList.add("wrong");
 }

 $("feedback").textContent=isCorrect?
 "✅ 정답입니다!":"❌ 정답: "+correct;

 $("nextBtn").classList.remove("hidden");

}

/* =========================
   다음 문제
========================= */

function nextQuestion(){

 index++;

 if(index>=questions.length){
  finishQuiz();
 }else{
  renderQuestion();
 }

}

/* =========================
   결과 화면
========================= */

function finishQuiz(){

 active=false;

 showPage("result");

 const correct=answers.filter(a=>a.isCorrect).length;

 const total=answers.length;

 const percent=total?
 Math.round(correct/total*100):0;

 $("score").textContent=percent+"점";

 $("resultText").textContent=
 `${total}문제 중 ${correct}문제 정답`;

 const review=$("review");

 review.innerHTML="<h3>틀린 문제</h3>";

 const missed=answers.filter(a=>!a.isCorrect);

 if(!missed.length){
  review.append("모든 문제를 맞혔습니다!");
 }

 missed.forEach(a=>{

  const div=document.createElement("div");

  div.className="reviewItem";

  const title=document.createElement("strong");
  title.textContent=a.word.en;

  const meaning=document.createElement("div");
  meaning.textContent="뜻: "+a.word.ko;

  const selected=document.createElement("div");
  selected.textContent="선택한 답: "+a.selected;

  div.append(title,meaning,selected);
  review.appendChild(div);

 });

}

/* =========================
   오답노트
========================= */

function showWrong(){

 showPage("wrongPage");

 const list=$("wrongList");

 list.innerHTML="";

 const items=words.filter(w=>getStat(w).pendingWrong);

 if(!items.length){
  list.textContent="현재 오답노트가 비어 있습니다.";
  return;
 }

 items.sort((a,b)=>
  getStat(b).wrong-getStat(a).wrong
 );

 items.forEach(w=>{

  const div=document.createElement("div");
  div.className="reviewItem";

  const text=document.createElement("div");
  text.textContent=w.en+" — "+w.ko;

  const count=document.createElement("span");
  count.className="small";
  count.textContent="누적 오답 "+getStat(w).wrong+"회";

  div.append(text,count);
  list.appendChild(div);

 });

}

/* =========================
   학습 종료
========================= */

function quitQuiz(){

 if(!confirm("현재 학습을 종료할까요?")){
  return;
 }

 active=false;

 if(answers.length){
  finishQuiz();
 }else{
  goHome();
 }

}

function goHome(){

 active=false;

 showPage("home");

 updateDashboard();

}

/* =========================
   심화 보기 데이터
========================= */

async function importAdvanced(){

 const file=$("advancedFile").files[0];

 if(!file){
  alert("JSON 파일을 선택해 주세요.");
  return;
 }

 try{

  const text=await file.text();

  const data=JSON.parse(text);

  if(!data || typeof data!=="object" || Array.isArray(data)){
   throw new Error("올바른 JSON 객체가 아닙니다.");
  }

  let count=0;

  Object.entries(data).forEach(([k,v])=>{

   if(!v || typeof v!=="object")return;

   const valid={};

   if(Array.isArray(v.ko)){
    valid.ko=[...new Set(
     v.ko.filter(x=>typeof x==="string"&&x.trim())
    )].slice(0,3);
   }

   if(Array.isArray(v.en)){
    valid.en=[...new Set(
     v.en.filter(x=>typeof x==="string"&&x.trim())
    )].slice(0,3);
   }

   if(valid.ko || valid.en){
    advanced[k]=valid;
    count++;
   }

  });

  save();

  alert(count+"개 심화 보기 데이터 등록 완료!");

 }catch(e){

  alert("심화 보기 파일 오류: "+e.message);

 }

}

/* =========================
   백업
========================= */

function exportBackup(){

 const data={
  version:2,
  exportedAt:new Date().toISOString(),
  words,
  stats,
  advanced
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;
 a.download="toeic_voca_backup.json";
 a.click();

 setTimeout(()=>URL.revokeObjectURL(url),1000);

}

/* =========================
   복원
========================= */

async function restoreBackup(){

 const file=$("restoreFile").files[0];

 if(!file){
  alert("백업 파일을 선택해 주세요.");
  return;
 }

 if(!confirm("현재 데이터를 백업 파일로 교체할까요?")){
  return;
 }

 try{

  const data=JSON.parse(await file.text());

  if(!Array.isArray(data.words) ||
     !data.stats ||
     typeof data.stats!=="object"){
   throw new Error("올바른 백업 파일이 아닙니다.");
  }

  words=data.words;
  stats=data.stats;
  advanced=data.advanced||{};

  save();

  alert("복원 완료!");

 }catch(e){

  alert("복원 실패: "+e.message);

 }

}

updateDashboard();
